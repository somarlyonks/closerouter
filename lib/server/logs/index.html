<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs | CloseRouter</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' version='1.1' viewBox='-10 0 382 293.72' width='382' height='382'%3E%3Cg transform='translate(382, 293.72) scale(-1, -1)'%3E%3Cpath fill='%2329cc65' d='M303.9475,17.19926c42.79734,0,77.48933,34.69327,77.48933,77.48933s-34.69199,77.48933-77.48933,77.48933l76.86166,76.86244c9.76367,9.76313,2.84903,26.45667-10.95697,26.45667h-220.88335c-71.32686,0-129.14889-57.82202-129.14889-129.14889S77.64197,17.19926,148.96884,17.19926h154.97866ZM148.96884,68.85881c-42.79607,0-77.48933,34.69327-77.48933,77.48933s34.69327,77.48933,77.48933,77.48933,77.48933-34.69327,77.48933-77.48933-34.69327-77.48933-77.48933-77.48933Z'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        /* @asset index.css */

        header label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: small;
        }

        #totals {
            font-family: var(--font-mono);
            font-size: small;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 1ch;

            & svg:nth-of-type(2) {
                transform: rotate(180deg);
            }
        }

        #log {
            height: calc(100vh - 48px);
            overflow-y: auto;
            overflow-x: hidden;
            margin: 0;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: small;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .group {
            padding: 2px 0 2px 10px;
            border-left: 2px solid currentColor;

            & .line {
                display: flex;
                gap: 1ch;
                line-height: 1;

                & .ts {
                    color: var(--color-foreground-secondary);
                }
            }

            & details {
                flex: 1;

                & summary {
                    cursor: pointer;
                    display: flex;
                    gap: 1ch;
                }

                & .detail-tokens,
                & .detail-headers,
                & .detail-body {
                    margin: 4px 0 0 0;
                    font-size: smaller;
                    color: var(--color-foreground);
                }

                & .detail-tokens {
                    >div {
                        display: flex;
                        align-items: center;

                        &:nth-of-type(2) {
                            & svg {
                                transform: rotate(180deg);
                            }
                        }
                    }
                }

                & .detail-body {
                    padding: 6px 8px;
                    border: 1px solid var(--color-border);
                    border-radius: 6px;
                    overflow-x: auto;
                    word-break: break-word;
                    white-space: break-spaces;
                }
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand">/* @asset logo.svg */Logs</h1>
        <span id="totals" class="success" title="">
            /* @asset arrow-up.svg */ <span class="in">?</span>
            /* @asset arrow-up.svg */ <span class="out">?</span>
        </span>
        <button id="refresh">Refresh</button>
        <button id="clear">Clear</button>
    </header>
    <main>
        <div id="log"></div>
    </main>

    /* @asset key-dialog.html */

    <script type="module">
        /* @asset toast.js */

        const MAX_ENTRIES = 1000

        const logEl = document.getElementById('log')

        const key = await promptKey()
        const groups = new Map();

        const totals = {in: 0, out: 0, cached: 0, count: 0}
        const flips = {in: 0, out: 0}

        function renderTotals() {
            const totalsEl = document.getElementById('totals')
            if (!totalsEl) return

            totalsEl.title = `${totals.count} requests / ${totals.in.toLocaleString()} tokens in (${(totals.cached / totals.in * 100).toFixed(2)}% cached) / ${totals.out.toLocaleString()} tokens out`

            flipNumber('in')
            flipNumber('out')
        }

        function flipNumber(key) {
            const el = document.querySelector('#totals .' + key)
            if (!el) return

            cancelAnimationFrame(flips[key])
            const from = Number(String(el.textContent).replace(/[^\d.-]/g, '')) || 0
            const to = totals[key]
            const duration = 5000
            const start = performance.now()

            function tick(now) {
                const t = Math.min(1, Math.max(0, (now - start) / duration))
                const eased = 1 - Math.pow(1 - t, 3)
                const value = Math.round(from + (to - from) * eased)
                el.textContent = value.toLocaleString()
                if (t < 1) flips[key] = requestAnimationFrame(tick)
            }

            flips[key] = requestAnimationFrame(tick)
        }

        function trim() {
            while (logEl.childNodes.length > MAX_ENTRIES) {
                const node = logEl.lastChild
                logEl.removeChild(node)
                groups.delete(node.dataset.id)
            }
        }

        function classify(status) {
            if (status === undefined) return 'info'
            if (status >= 500) return 'error'
            if (status >= 400) return 'warning'
            if (status >= 300) return 'info'
            return 'success'
        }

        function timeText(time) {
            const date = new Date(time)
            if (isNaN(date.getTime())) return ''
            return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false})
        }

        function buildDetails(entry) {
            return [
                buildTokenDetail(entry),
                buildHeaders(entry.requestHeaders, 'request'),
                buildHeaders(entry.responseHeaders, 'response'),
                buildBody(entry.requestBody, 'request'),
                buildBody(entry.responseBody, 'response'),
            ]

            function buildTokenDetail(entry) {
                if (entry.inputTokens === undefined && entry.outputTokens === undefined) return null

                const compact = new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 0}).format
                const pad = n => String(compact(n)).padStart(4, ' ')
                const parts = []

                if (entry.inputTokens !== undefined) {
                    const cacheRate = entry.cachedTokens === undefined ? '' : ('(' + Math.round(entry.cachedTokens / (entry.inputTokens || 1) * 100) + '% cached)')
                    parts.push(createElement('div', {innerHTML: `/* @asset arrow-up.svg */` + pad(entry.inputTokens) + ' tokens ' + cacheRate}))
                }
                if (entry.outputTokens !== undefined) {
                    const genMs = entry.durationMs || entry.generationMs
                    const tps = !genMs ? '' : ('(' + Math.round(entry.outputTokens / (genMs / 1000)) + ' tok/s)')
                    parts.push(createElement('div', {innerHTML: `/* @asset arrow-up.svg */` + pad(entry.outputTokens) + ' tokens ' + tps}))
                }

                if (entry.durationMs !== undefined) {
                    const ttft = entry.ttftMs !== undefined ? ('(TTFT ' + entry.ttftMs + 'ms)') : ''
                    parts.push(createElement('div', {textContent: entry.durationMs + 'ms' + ttft}))
                }

                return createElement('div', {className: 'detail-tokens'}, ...parts)
            }

            function buildHeaders(headers, side) {
                if (!headers || !Object.keys(headers).length) return null
                return createElement('div', {className: 'detail-headers ' + side, textContent: formatHeaders(headers)})

                function formatHeaders(h) {
                    const secretFields = ['authorization', 'cookie', 'set-cookie']
                    let out = ''
                    for (const key of Object.keys(h)) {
                        const value = secretFields.includes(key) ? '******************' : h[key]
                        out += `${key}: ${value}\n`
                    }
                    return out
                }
            }

            function buildBody(body, side) {
                if (!body) return null
                return createElement('pre', {className: 'detail-body ' + side, textContent: prettyBody(body)})
            }
        }

        function prettyBody(text) {
            try {
                return JSON.stringify(JSON.parse(text), null, 2)
            } catch {
                return text
            }
        }

        function createElement(tag, attributes = {}, ...children) {
            const el = document.createElement(tag)
            Object.entries(attributes).forEach(([key, value]) => {el[key] = value})
            children.filter(c => c !== null).forEach(child => el.appendChild(child))
            return el
        }

        async function ensureBody(details, entry) {
            if (!details.open || details.dataset.bodyLoaded === '1') return
            details.dataset.bodyLoaded = '1'

            const id = typeof entry.id === 'number' ? entry.id : undefined
            if (!id) return

            details.querySelector('.detail-body.request')?.remove()
            details.appendChild(createElement('pre', {className: 'detail-body request', textContent: 'loading...'}))
            details.querySelector('.detail-body.response')?.remove()
            details.appendChild(createElement('pre', {className: 'detail-body response', textContent: 'loading...'}))

            try {
                const res = await fetch('/logs/' + id, {headers: {Authorization: 'Bearer ' + key}})
                if (!res.ok) throw new Error('not ok')
                const data = await res.json()

                Reflect.set(details.querySelector('.detail-body.request') || {}, 'textContent', data.requestBody ? prettyBody(data.requestBody) : '(no body recorded)')
                Reflect.set(details.querySelector('.detail-body.response') || {}, 'textContent', data.responseBody ? prettyBody(data.responseBody) : '(no body recorded)')
            } catch {
                toast({title: 'Error', message: 'Failed to load body for request with id ' + id, type: 'error'})
                details.dataset.bodyLoaded = '0'
            }
        }

        function appendEntry(entry) {
            if (!entry || groups.has(entry.id)) return

            const cls = classify(entry.status)
            const group = createElement('div', {className: 'group ' + cls},
                createElement('div', {className: 'line'},
                    createElement('details', {ontoggle() {ensureBody(this, entry)} },
                        createElement('summary', {},
                            createElement('span', {className: 'ts', textContent: timeText(entry.time)}),
                            createElement('strong', {className: 'info', textContent: entry.method}),
                            entry.status !== undefined ? createElement('strong', {textContent: String(entry.status)}) : null,
                            createElement('span', {className: 'info', textContent: entry.path}),
                            ...buildAppendix(),
                        ),
                        ...buildDetails(entry),
                    )
                ),
            )

            logEl.insertBefore(group, logEl.firstChild)
            trim()
            group.dataset.id = entry.id
            groups.set(entry.id, group)

            function buildAppendix() {
                if (!entry.provider || !entry.model) return []
                return [createElement('span', {className: 'foreground', textContent: '[' + entry.provider + '/' + entry.model + ']'})]
            }
        }

        function loadHistory() {
            const refreshBtn = document.getElementById('refresh')
            refreshBtn.disabled = true

            return Promise.all([
                fetch('/logs', {method: 'GET', headers: {accept: 'application/json', Authorization: 'Bearer ' + key}}).then(res => res.ok ? res.json() : null),
                fetch('/usage', {method: 'GET', headers: {Authorization: 'Bearer ' + key}}).then(res => res.ok ? res.json() : null),
            ]).then(([data, usage]) => {
                if (data && Array.isArray(data.entries)) data.entries.forEach(appendEntry)
                if (usage && typeof usage.count === 'number') {
                    totals.count = usage.count
                    totals.in = usage.inTokens
                    totals.out = usage.outTokens
                    totals.cached = usage.cachedTokens || 0
                }
            }).catch(() => { }).finally(() => {
                renderTotals()
                refreshBtn.disabled = false
            })

            function renderHistory(entry) {
                appendRequest(entry)
                appendResponse(entry)
            }
        }

        async function start() {
            toast({title: 'loading...', promise: loadHistory(), type: 'info'})
        }

        document.getElementById('refresh')?.addEventListener('click', start)
        document.getElementById('clear')?.addEventListener('click', () => {
            logEl.textContent = ''
            groups.clear()
        })

        start()
    </script>
</body>

</html>
