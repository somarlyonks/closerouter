<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs | CloseRouter</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' version='1.1' viewBox='-10 0 382 293.72' width='382' height='382'%3E%3Cg transform='translate(382, 293.72) scale(-1, -1)'%3E%3Cpath fill='%2329cc65' d='M303.9475,17.19926c42.79734,0,77.48933,34.69327,77.48933,77.48933s-34.69199,77.48933-77.48933,77.48933l76.86166,76.86244c9.76367,9.76313,2.84903,26.45667-10.95697,26.45667h-220.88335c-71.32686,0-129.14889-57.82202-129.14889-129.14889S77.64197,17.19926,148.96884,17.19926h154.97866ZM148.96884,68.85881c-42.79607,0-77.48933,34.69327-77.48933,77.48933s34.69327,77.48933,77.48933,77.48933,77.48933-34.69327,77.48933-77.48933-34.69327-77.48933-77.48933-77.48933Z'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        /* @asset index.css */

        header label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: small;
        }

        #totals {
            font-family: var(--font-mono);
            font-size: small;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 1ch;

            & svg:nth-of-type(2) {
                transform: rotate(180deg);
            }
        }

        #log {
            height: calc(100vh - 48px);
            overflow-y: auto;
            overflow-x: hidden;
            margin: 0;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: small;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .group {
            padding: 2px 0 2px 10px;
            border-left: 2px solid currentColor;

            &.responding {
                color: var(--color-info);
            }

            & .line {
                display: flex;
                gap: 1ch;
                line-height: 1;

                & .arrow {
                    flex-shrink: 0;

                    &.in {
                        color: var(--color-info);

                        & svg {
                            transform: rotate(90deg);
                        }
                    }

                    &.out {
                        color: currentColor;

                        & svg {
                            transform: rotate(270deg);
                        }
                    }
                }

                & .ts {
                    color: var(--color-foreground-secondary);
                }

                &.res.pending .arrow {
                    animation: pulse 1s ease-in-out infinite;
                }
            }

            & details {
                flex: 1;

                & summary {
                    cursor: pointer;
                    display: flex;
                    gap: 1ch;
                }

                & .detail-tokens,
                & .detail-headers,
                & .detail-body {
                    margin: 4px 0 0 0;
                    font-size: smaller;
                    color: var(--color-foreground);
                }

                & .detail-tokens {
                    >div {
                        display: flex;
                        align-items: center;

                        &:nth-of-type(2) {
                            & svg {
                                transform: rotate(180deg);
                            }
                        }
                    }
                }

                & .detail-body {
                    padding: 6px 8px;
                    border: 1px solid var(--color-border);
                    border-radius: 6px;
                    overflow-x: auto;
                    word-break: break-word;
                    white-space: break-spaces;
                }
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(0px);
            }

            25% {
                transform: translateX(10px);
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand">/* @asset logo.svg */Logs</h1>
        <span id="totals" class="success" title="">
            /* @asset arrow-up.svg */ <span class="in">0</span>
            /* @asset arrow-up.svg */ <span class="out">0</span>
        </span>
        <button id="clear">Clear</button>
    </header>
    <main>
        <div id="log"></div>
    </main>

    /* @asset key-dialog.html */

    <script type="module">
        /* @asset toast.js */

        const MAX_ENTRIES = 1000

        const logEl = document.getElementById('log')

        let es = null;
        const groups = new Map();

        const totals = {in: 0, out: 0, count: 0}
        const flips = {in: 0, out: 0}

        function renderTotals() {
            const totalsEl = document.getElementById('totals')
            if (!totalsEl) return

            totalsEl.title = `${totals.count} requests / ${totals.in.toLocaleString()} tokens in / ${totals.out.toLocaleString()} tokens out`

            flipNumber('in')
            flipNumber('out')
        }

        function flipNumber(key) {
            const el = document.querySelector('#totals .' + key)
            if (!el) return

            cancelAnimationFrame(flips[key])
            const from = Number(String(el.textContent).replace(/[^\d.-]/g, '')) || 0
            const to = totals[key]
            const duration = 5000
            const start = performance.now()

            function tick(now) {
                const t = Math.min(1, Math.max(0, (now - start) / duration))
                const eased = 1 - Math.pow(1 - t, 3)
                const value = Math.round(from + (to - from) * eased)
                el.textContent = value.toLocaleString()
                if (t < 1) flips[key] = requestAnimationFrame(tick)
            }

            flips[key] = requestAnimationFrame(tick)
        }

        function trim() {while (logEl.childNodes.length > MAX_ENTRIES) logEl.removeChild(logEl.firstChild)}

        function classify(status) {
            if (status === undefined) return 'info'
            if (status >= 500) return 'error'
            if (status >= 400) return 'warning'
            if (status >= 300) return 'info'
            return 'success'
        }

        function buildDetails(entry, side) {
            const ret = []
            const headers = side === 'request' ? entry.requestHeaders : entry.responseHeaders
            const body = side === 'request' ? entry.requestBody : entry.responseBody
            const hasHeaders = headers && Object.keys(headers).length > 0

            if (entry.inputTokens !== undefined || entry.outputTokens !== undefined) {
                ret.push(createElement('div', {className: 'detail-tokens'}, ...buildTokenDetail(entry)))
            }
            if (hasHeaders) {
                ret.push(createElement('div', {className: 'detail-headers', textContent: formatHeaders(headers)}))
            }
            if (body) {
                ret.push(createElement('pre', {className: 'detail-body', textContent: prettyBody(body)}))
            }
            return ret

            function buildTokenDetail(entry) {
                const compact = new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 0}).format
                const pad = n => String(compact(n)).padStart(4, ' ')
                const parts = []

                if (entry.inputTokens !== undefined) {
                    const cacheRate = entry.cachedTokens === undefined ? '' : ('(' + Math.round(entry.cachedTokens / (entry.inputTokens || 1) * 100) + '% cached)')
                    parts.push(createElement('div', {innerHTML: `/* @asset arrow-up.svg */` + pad(entry.inputTokens) + ' tokens ' + cacheRate}))
                }
                if (entry.outputTokens !== undefined) {
                    const genMs = entry.generationMs || entry.durationMs
                    const tps = !genMs ? '' : ('(' + Math.round(entry.outputTokens / (genMs / 1000)) + ' tok/s)')
                    parts.push(createElement('div', {innerHTML: `/* @asset arrow-up.svg */` + pad(entry.outputTokens) + ' tokens ' + tps}))
                }

                return parts
            }

            function formatHeaders(h) {
                const secretFields = ['authorization', 'cookie', 'set-cookie']
                let out = ''
                for (const key of Object.keys(h)) {
                    const value = secretFields.includes(key) ? '******************' : h[key]
                    out += `${key}: ${value}\n`
                }
                return out
            }

            function prettyBody(text) {
                try {
                    return JSON.stringify(JSON.parse(text), null, 2)
                } catch {
                    return text
                }
            }
        }

        function createElement(tag, attributes = {}, ...children) {
            const el = document.createElement(tag)
            Object.entries(attributes).forEach(([key, value]) => {el[key] = value})
            children.forEach(child => el.appendChild(child))
            return el
        }

        function ts(time) {
            return createElement('span', {className: 'ts', textContent: (time || '').slice(11, 19)})
        }

        function onRequest(entry) {
            const group = createElement('div', {className: 'group responding'},
                createElement('div', {className: 'line req'},
                    createElement('strong', {className: 'arrow in', innerHTML: `/* @asset arrow-up.svg */`}),
                    createElement('details', {},
                        createElement('summary', {},
                            ts(entry.time),
                            createElement('strong', {className: 'info', textContent: entry.method}),
                            createElement('span', {className: 'info', textContent: entry.path}),
                            ...buildAppendix(),
                        ),
                        ...buildDetails(entry, 'request'),
                    )
                )
            )

            const resLine = createElement('div', {className: 'line res pending'},
                createElement('span', {className: 'arrow out', innerHTML: `/* @asset arrow-up.svg */`})
            )
            group.appendChild(resLine)

            logEl.appendChild(group)
            trim()
            groups.set(entry.id, {group, resLine});

            function buildAppendix() {
                if (entry.path === '/v1/chat/completions') {
                    const model = readBody('model')
                    if (model) return [createElement('span', {className: 'foreground', textContent: `[${model}]`})]
                }

                return []

                function readBody(field) {
                    if (!entry.requestBody) return ''
                    try {
                        const body = JSON.parse(entry.requestBody)
                        return body[field]
                    } catch { }
                    return ''
                }
            }
        }

        function onResponse(entry) {
            const cls = classify(entry.status)
            let groupEntry = groups.get(entry.id)
            if (!groupEntry) {
                const group = createElement('div', {className: 'group'})
                const resLine = createElement('div', {className: 'line res'})
                groupEntry = {group, resLine}
                group.appendChild(resLine)
                logEl.appendChild(group)

                trim()
            }
            groupEntry.group.className = 'group ' + cls
            groupEntry.resLine.classList.remove('pending')
            groupEntry.resLine.textContent = ''
            appendResponse(groupEntry.resLine, entry);
            if (entry.inputTokens !== undefined) totals.in += entry.inputTokens
            if (entry.outputTokens !== undefined) totals.out += entry.outputTokens
            totals.count++
            renderTotals()
            groups.delete(entry.id)

            function appendResponse(line, entry) {
                const genMs = entry.generationMs || entry.durationMs

                line.appendChild(createElement('strong', {className: 'arrow out', innerHTML: `/* @asset arrow-up.svg */`}))
                line.appendChild(createElement('details', {},
                    createElement('summary', {},
                        ts(entry.time),
                        ...(entry.status !== undefined ? [createElement('strong', {textContent: String(entry.status)})] : []),
                        ...(entry.durationMs !== undefined ? [createElement('span', {textContent: entry.durationMs + 'ms'})] : []),
                        ...(entry.ttftMs !== undefined ? [createElement('span', {className: 'foreground', textContent: entry.ttftMs + 'ms', title: 'Time to First Token'})] : []),
                        ...((!entry.outputTokens || !genMs) ? [] : [createElement('span', {className: 'foreground', textContent: (Math.floor(entry.outputTokens / (genMs / 1000)) + ' tok/s')})]),
                    ),
                    ...buildDetails(entry, 'response'),
                ))
            }
        }

        async function start() {
            const key = await promptKey()
            // EventSource cannot set headers, so auth via a cookie it sends automatically.
            document.cookie = 'cr-key=' + key + '; path=/; SameSite=Strict'
            let closeReconnectToast = null
            const closeConnectingToast = toast({title: 'connecting...', timeout: 0, type: 'warning'})
            es = new EventSource('/logs')
            es.addEventListener('open', () => {
                closeConnectingToast()
                closeReconnectToast?.()
                toast({title: 'connected', type: 'success'})
            })
            es.addEventListener('log', e => handle('log', e.data))
            es.addEventListener('error', function () {
                if (!es) return
                if (es.readyState === EventSource.CLOSED) {
                    es = null
                    toast({title: 'error', type: 'error'})
                } else {
                    if (closeReconnectToast) return
                    closeReconnectToast = toast({title: 'reconnecting...', type: 'warning'})
                }
            })

            function handle(event, data) {
                if (event !== 'log' || !data) return
                var entry
                try {entry = JSON.parse(data)} catch (e) {return }
                if (entry.phase === 'request') onRequest(entry)
                else if (entry.phase === 'response') onResponse(entry)
            }
        }

        document.getElementById('clear')?.addEventListener('click', () => {
            logEl.textContent = ''
            groups.clear()
        })

        start()
    </script>
</body>

</html>
