<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Config | CloseRouter</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' version='1.1' viewBox='-10 0 382 293.72' width='382' height='382'%3E%3Cg transform='translate(382, 293.72) scale(-1, -1)'%3E%3Cpath fill='%2329cc65' d='M303.9475,17.19926c42.79734,0,77.48933,34.69327,77.48933,77.48933s-34.69199,77.48933-77.48933,77.48933l76.86166,76.86244c9.76367,9.76313,2.84903,26.45667-10.95697,26.45667h-220.88335c-71.32686,0-129.14889-57.82202-129.14889-129.14889S77.64197,17.19926,148.96884,17.19926h154.97866ZM148.96884,68.85881c-42.79607,0-77.48933,34.69327-77.48933,77.48933s34.69327,77.48933,77.48933,77.48933,77.48933-34.69327,77.48933-77.48933-34.69327-77.48933-77.48933-77.48933Z'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        /* @asset index.css */

        main {
            padding: 16px 12px;
        }

        .section {
            max-width: 820px;
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            gap: 1rem;

            & h2 {
                font-size: medium;
                color: var(--color-foreground);
                margin: 0;
            }

            & .actions {
                max-width: 820px;
                margin: 0 auto;
                display: flex;
                width: 100%;

                & button {
                    flex: 1;
                }
            }
        }

        .field {
            display: flex;
            align-items: flex-start;
            gap: inherit;

            & label {
                width: 100px;
                flex-shrink: 0;
                line-height: 31px;
                color: var(--color-foreground-secondary);
            }

            & input {
                flex: 1;
                background: var(--color-background);
            }

            & .models {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
        }

        .general,
        .provider {
            width: 100%;
            padding: 12px;
            background: #161b22;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .provider {
            & .provider-header {
                display: flex;
                align-items: center;
                gap: inherit;

                & .provider-name-input {
                    font-weight: bold;
                    flex: 1;
                    color: var(--color-info);
                    background: var(--color-background);
                }
            }
        }

        .model-row {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            margin-bottom: 4px;
            position: relative;

            & textarea {
                flex: 1;
                font: inherit;
                line-height: 22px;
                font-family: var(--font-mono);
                background: var(--color-background);
                color: currentColor;
                border: 1px solid transparent;
                border-radius: 6px;
                padding: 4px 8px;
                outline: none;
                resize: none;
                white-space: nowrap;
                overflow-x: auto;

                &:hover,
                &:focus {
                    border-color: var(--color-border);
                }
            }

            & button {
                position: absolute;
                inset-inline-end: 4px;
                inset-block-start: 4px;
            }
        }

        .provider-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand">/* @asset logo.svg */Config</h1>
        <button id="save" class="primary">Save</button>
    </header>
    <main>
        <div id="form"></div>
    </main>

    /* @asset footer.html */

    /* @asset key-dialog.html */

    <script type="module">
        /* @asset toast.js */

        const saveBtn = document.getElementById('save')
        const formEl = document.getElementById('form')

        function authHeaders(key) {
            return {Authorization: 'Bearer ' + key}
        }

        function el(tag, attrs = {}, ...children) {
            const e = document.createElement(tag)
            for (const [k, v] of Object.entries(attrs)) {
                if (v === null || v === undefined) continue
                e[k] = v
            }
            for (const child of children) {
                if (child == null) continue
                e.appendChild(typeof child === 'string' ? document.createTextNode(child) : child)
            }
            return e
        }

        function renderForm(cfg) {
            formEl.textContent = ''

            const general = el('div', {className: 'section'},
                el('h2', {textContent: 'General'}),
                el('div', {className: 'general'},
                    el('div', {className: 'field'},
                        el('label', {textContent: 'Port'}),
                        el('input', {type: 'number', id: 'cfg-port', value: String(cfg.port ?? '')}),
                    ),
                    el('div', {className: 'field'},
                        el('label', {textContent: 'Key'}),
                        el('input', {type: 'password', id: 'cfg-key', value: cfg.key ?? ''}),
                    ),
                ),
            )
            formEl.appendChild(general)

            formEl.appendChild(el('div', {className: 'section'},
                el('h2', {textContent: 'Providers'}),
                ...Array.from(Object.entries(cfg.providers || {}), ([name, provider]) => renderProvider(name, provider)),
                el('div', {className: 'actions'},
                    el('button', {
                        className: 'add',
                        textContent: '+ Add provider',
                        onclick() {
                            this.parentNode.parentNode.insertBefore(
                                renderProvider('', {base_url: '', api_key: '', models: []}),
                                this.parentNode,
                            )
                        },
                    })
                )
            ))

            function renderProvider(name, provider) {
                const models = provider.models || []

                return el('div', {className: 'provider'},
                    el('div', {className: 'provider-header'},
                        el('input', {
                            type: 'text',
                            className: 'provider-name-input',
                            value: name,
                            placeholder: 'provider name',
                        }),
                        el('button', {
                            className: 'danger',
                            textContent: 'Remove',
                            onclick: () => {if (confirm('Remove this provider?')) card.remove()},
                        }),
                    ),
                    el('div', {className: 'field'},
                        el('label', {textContent: 'Base URL'}),
                        el('input', {type: 'text', className: 'cfg-base-url', value: provider.base_url || ''}),
                    ),
                    el('div', {className: 'field'},
                        el('label', {textContent: 'API Key'}),
                        el('input', {type: 'password', className: 'cfg-api-key', value: provider.api_key || ''}),
                    ),
                    el('div', {className: 'field'},
                        el('label', {textContent: 'Models'}),
                        el('div', {className: 'models'},
                            ...models.map(model => renderModelRow(modelToString(model))),
                            el('button', {
                                className: 'add',
                                textContent: '+ Add model',
                                onclick() {
                                    this.parentNode.insertBefore(renderModelRow(''), this)
                                },
                            })
                        ),
                    )
                )

                function renderModelRow(value) {
                    return el('div', {className: 'model-row'},
                        el('textarea', {
                            value,
                            rows: value.split('\n').length,
                            placeholder: 'model id or JSON object',
                            oninput(e) {e.target.rows = Math.max(1, e.target.value.split('\n').length)},
                        }),
                        el('button', {
                            className: 'icon danger',
                            innerHTML: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z"/></svg>',
                            onclick: () => row.remove(),
                        }),
                    )
                }

                function modelToString(model) {
                    return typeof model === 'string' ? model : JSON.stringify(model, null, 2)
                }
            }
        }

        async function loadConfig() {
            const key = await promptKey()

            const closeLoadingToast = toast({title: 'loading...', timeout: 0, type: 'warning'})
            try {
                const res = await fetch('/config', {
                    headers: {...authHeaders(key), Accept: 'application/json'},
                })
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}))
                    throw new Error(err.error?.message || 'HTTP ' + res.status)
                }
                renderForm(await res.json())
            } catch (e) {
                toast({title: 'Error', message: e.message, timeout: 0, type: 'error'})
            } finally {
                closeLoadingToast()
            }
        }

        async function saveConfig() {
            const key = await promptKey()
            const body = JSON.stringify(collectConfig())
            const closeSaveToast = toast({title: 'saving...', timeout: 0, type: 'warning'})
            try {
                const res = await fetch('/config', {
                    method: 'PUT',
                    headers: {...authHeaders(key), 'Content-Type': 'application/json'},
                    body,
                })
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}))
                    throw new Error(err.error?.message || 'HTTP ' + res.status)
                }
                renderForm(await res.json())
                toast({title: 'saved', type: 'success'})
            } catch (e) {
                toast({title: 'Error', message: e.message, timeout: 0, type: 'error'})
            } finally {
                closeSaveToast()
            }

            function collectConfig() {
                const port = parseInt(document.getElementById('cfg-port').value, 10)
                const key = document.getElementById('cfg-key').value

                const providers = {}
                for (const card of formEl.querySelectorAll('.provider')) {
                    const name = card.querySelector('.provider-name-input').value.trim()
                    if (!name) continue
                    const models = []
                    for (const row of card.querySelectorAll('.model-row')) {
                        const parsed = parseModel(row.querySelector('textarea').value)
                        if (parsed !== null) models.push(parsed)
                    }
                    providers[name] = {
                        base_url: card.querySelector('.cfg-base-url').value,
                        api_key: card.querySelector('.cfg-api-key').value,
                        models,
                    }
                }

                const cfg = {providers}
                if (!isNaN(port)) cfg.port = port
                if (key) cfg.key = key
                return cfg

                function parseModel(text) {
                    const trimmed = text.trim()
                    if (!trimmed) return null
                    if (trimmed.startsWith('{')) {
                        try {return JSON.parse(trimmed)} catch {return trimmed}
                    }
                    return trimmed
                }
            }
        }

        saveBtn.addEventListener('click', saveConfig)

        loadConfig()
    </script>
</body>

</html>
